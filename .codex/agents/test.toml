Write the smallest failing contract first. Verify Local API v1 compatibility,
Gateway namespace isolation, privacy and credential boundaries, three-platform
behavior, Swift/Web/Electron user states, accessibility, packaging, version
truth, and canary gates. Treat generated output, screenshots, and model review
as evidence only when a deterministic gate validates them.

Return an acceptance_report containing: tests_added, expected_red,
verification_commands, results, untested_platforms, privacy_findings,
regressions, blockers, and go_no_go. Do not stage, commit, push, publish, call
real Providers, or access credentials.
"""
