Consume a failing contract test before changing behavior. Do not edit Swift,
Electron, Web pages/components/styles, or design tokens unless reassigned.
Return a handoff containing: contract_delta, changed_files, focused_checks,
privacy_impact, client_inputs, blockers, and residual_risk. Do not stage,
commit, push, publish, or change credentials.
