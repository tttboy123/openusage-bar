name: OpenUsage Bar canary report
description: Submit an opt-in, credential-free 1.0 canary result.
title: "[Canary] "
body:
  - type: markdown
    attributes:
      value: |
        Never include API keys, cookies, account names, prompts, responses, raw Provider payloads, device serial numbers, or unredacted logs. Security issues belong in a private vulnerability report.
        Follow the [canary protocol](https://github.com/tttboy123/openusage-bar/blob/main/docs/canary.md) and the [Local API v1 compatibility policy](https://github.com/tttboy123/openusage-bar/blob/main/docs/api/compatibility-v1.md).
  - type: input
    id: canary-label
    attributes:
      label: Random canary label
      description: Use a random label, not a username, hostname, email, serial number, or account name.
      placeholder: canary-a1b2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Product version and build
      placeholder: 0.6.0 (9)
    validations:
      required: true
  - type: input
    id: previous-version
    attributes:
      label: Previous version and build
      description: Record the published N-1 build used for the upgrade test.
      placeholder: 0.4.4 (8)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 15.6 or 26.0
    validations:
      required: true
  - type: dropdown
    id: install-scope
    attributes:
      label: Installation scope
      options:
        - /Applications
        - ~/Applications
    validations:
      required: true
  - type: dropdown
    id: setup-class
    attributes:
      label: Provider configuration class
      options:
        - Empty setup
        - Local clients only
        - One quota Provider
        - Custom daily usage or cost feed
        - Multiple Providers
    validations:
      required: true
  - type: input
    id: period
    attributes:
      label: Observation period in UTC
      placeholder: 2026-07-18 through 2026-08-16
    validations:
      required: true
  - type: textarea
    id: event-dates
    attributes:
      label: UTC event dates
      description: Record only UTC dates and pass/fail results. Do not include hostnames, usernames, account names, or absolute home paths.
      placeholder: |
        Install: YYYY-MM-DD — Pass
        Scheduled collection after restart: YYYY-MM-DD — Pass
        N-1 upgrade: YYYY-MM-DD — Pass
        Rollback and reinstall: YYYY-MM-DD — Pass
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Completed checks
      options:
        - label: Packaged candidate verifier passed checksum, manifest, SBOM, and all six attestations
          required: true
        - label: Clean install and first trustworthy fact completed
          required: true
        - label: Collector scheduled refresh completed
          required: true
        - label: Scheduled collection advanced after restart without Refresh
          required: true
        - label: Menu-bar item was visibly present and opened its popover
          required: true
        - label: N-1 upgrade completed without data decrease
          required: true
        - label: Rollback drill and candidate reinstall completed
          required: true
        - label: UI, CLI JSON, and Local API agreed at one dataRevision
          required: true
        - label: Balance state and freshness were checked, or this setup exposes no Balance capability
          required: true
  - type: dropdown
    id: blocking-incident
    attributes:
      label: Blocking incident observed
      options:
        - No
        - Yes - details below contain only sanitized codes and reproduction steps
    validations:
      required: true
  - type: dropdown
    id: diagnostic-scan
    attributes:
      label: Privacy scan result for attached diagnostics
      options:
        - No diagnostics attached
        - Passed locally before attachment
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety review
      options:
        - label: I included no credentials, cookies, account identity, prompts, responses, raw Provider payloads, unredacted logs, or absolute home paths.
          required: true
        - label: My random canary label does not identify a person, device, host, or Provider account.
          required: true
        - label: I will report any suspected private-data disclosure through a private vulnerability report instead of this public issue.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Sanitized notes
      description: Use fixed error codes and reproduction steps only. Report suspected disclosure privately.
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I am intentionally submitting this canary evidence and have reviewed it for private data.
          required: true
